<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · {{ site.site_name }}</title>
  <style>
    body{margin:0;background:#f6f5f0;color:#171717;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:760px;margin:0 auto;padding:70px 24px}a{color:inherit}.back{text-decoration:none;font-weight:700}h1{font-size:clamp(38px,7vw,64px);letter-spacing:-.045em;margin:55px 0 22px;line-height:1}.copy{font-size:18px;line-height:1.7;color:#444}.box{margin-top:30px;padding:22px;border:1px solid rgba(0,0,0,.09);border-radius:18px;background:#fff}.small{font-size:13px;color:#666;line-height:1.6}
  </style>
</head>
<body><main><a class="back" href="/">← {{ site.site_name }}</a><h1>{{ title }}</h1><div class="copy">{{ message }}</div>{% if detail %}<div class="box small">{{ detail }}</div>{% endif %}</main></body>
</html>
