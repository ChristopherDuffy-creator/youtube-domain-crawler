name: Production Link Hunter Batch

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Type APPROVE_MAX_0.18_USD to run one production batch"
        required: true
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: link-hunter-production-batch
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      PROJECT_ID: 31fbe878-aa83-4b74-9820-e9f0d13b984c
      ENVIRONMENT_ID: 9f670e7a-1b3d-4ccc-b450-092a70403ee9
      SERVICE_ID: 8aa9b741-7a20-4aef-8baf-c25ac82f6fce
      PUBLIC_URL: https://youtube-domain-crawler-production.up.railway.app
      RUN_CAP_USD: "0.18"
    steps:
      - name: Call the already-running guarded proof endpoint
        id: batch
        shell: bash
        env:
          APPROVAL: ${{ inputs.approval }}
        run: |
          set +e
          echo "batch_state=error" >> "$GITHUB_OUTPUT"
          echo "description=Production batch did not run" >> "$GITHUB_OUTPUT"

          finish() {
            echo "batch_state=$1" >> "$GITHUB_OUTPUT"
            echo "description=$2" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$APPROVAL" != "APPROVE_MAX_0.18_USD" ]; then
            finish "error" "Approval phrase did not match; zero paid calls made"
          fi

          body="$(curl -fsS "$PUBLIC_URL/health" 2>/dev/null)"
          BODY="$body" python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["BODY"])
          assert payload.get("database") == "ok"
          assert payload.get("dataforseo_configured") is True
          assert payload.get("link_hunter_enabled") is True
          PY
          if [ $? -ne 0 ]; then
            finish "error" "Feature flag or production readiness guard failed; zero paid calls made"
          fi

          # This only obtains the configured secret inside Railway in order to
          # authenticate a request to the already-running public application.
          # It never writes Railway variables, so it cannot cause a redeploy.
          npx -y @railway/cli@latest run --project "$PROJECT_ID" --environment "$ENVIRONMENT_ID" --service "$SERVICE_ID" \
            python - <<'PY' >/tmp/link-hunter-production-result.json 2>/tmp/link-hunter-production-result.err
          import os
          import urllib.request

          request = urllib.request.Request(
              os.environ["PUBLIC_URL"] + "/api/link-hunter/proof",
              method="POST",
              headers={"X-Admin-Token": os.environ["ADMIN_TOKEN"]},
          )
          print(urllib.request.urlopen(request, timeout=420).read().decode())
          PY
          result_code=$?
          if [ $result_code -ne 0 ]; then
            rm -f /tmp/link-hunter-production-result.json /tmp/link-hunter-production-result.err
            finish "error" "Guarded production endpoint returned an error"
          fi

          python - <<'PY'
          import json
          import os

          with open("/tmp/link-hunter-production-result.json", encoding="utf-8") as stream:
              payload = json.load(stream)
          counters = payload.get("counters") or {}
          cost = float(counters.get("provider_cost_usd") or 0.0)
          errors = int(counters.get("errors") or 0)
          budget = counters.get("daily_budget") or {}
          committed = float(budget.get("spent_usd") or 0.0) + float(budget.get("reserved_usd") or 0.0)
          if payload.get("status") == "skipped" and counters.get("run_in_progress") is True:
              description = "Proof already running; duplicate request safely skipped"
          elif payload.get("status") != "complete":
              raise SystemExit("production batch response was not complete")
          elif errors > 0:
              raise SystemExit("production batch reported item/provider errors")
          elif cost > 0.18:
              raise SystemExit("provider cost exceeded hard per-run ceiling")
          elif float(budget.get("limit_usd") or 0.0) != 2.16 or committed > 2.160001:
              raise SystemExit("daily provider spend ledger exceeded the approved ceiling")
          elif counters.get("daily_budget_skipped") is True:
              description = "Daily $2.16 provider cap reached; zero paid calls made"
          else:
              description = (
                  f"Batch complete: ${cost:.4f}; "
                  f"{int(counters.get('summary_screened') or 0)} screened; "
                  f"{int(counters.get('deep_proof_target_count') or 0)} deep; "
                  f"{int(counters.get('source_links_verified') or 0)} verified"
              )[:140]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("batch_state=success\\n")
              stream.write(f"description={description}\\n")
          PY
          guard_code=$?
          rm -f /tmp/link-hunter-production-result.json /tmp/link-hunter-production-result.err
          if [ $guard_code -ne 0 ]; then
            finish "error" "Production batch failed the spend/result guard"
          fi

      - name: Publish production batch status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH_STATE: ${{ steps.batch.outputs.batch_state }}
          DESCRIPTION: ${{ steps.batch.outputs.description }}
        run: |
          python - <<'PY' >/tmp/status.json
          import json
          import os

          print(json.dumps({
              "state": os.environ.get("BATCH_STATE") or "error",
              "context": "link-hunter/production-batch",
              "description": (os.environ.get("DESCRIPTION") or "Production batch did not complete")[:140],
          }))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/status.json >/dev/null
