name: Production Link Hunter Batch

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Type APPROVE_MAX_0.18_USD to run one production batch"
        required: true
        type: string
  schedule:
    - cron: "43 4,16 * * *"

permissions:
  contents: read
  statuses: write

concurrency:
  group: link-hunter-production-batch
  cancel-in-progress: false

jobs:
  batch:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.EXPANDOSAURUS_LINK_HUNTER_AUTOMATION_APPROVED_2026 == 'APPROVE_MAX_0.36_USD_PER_DAY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      PROJECT_ID: 31fbe878-aa83-4b74-9820-e9f0d13b984c
      ENVIRONMENT_ID: 9f670e7a-1b3d-4ccc-b450-092a70403ee9
      SERVICE_ID: 8aa9b741-7a20-4aef-8baf-c25ac82f6fce
      PUBLIC_URL: https://youtube-domain-crawler-production.up.railway.app
      RUN_CAP_USD: "0.18"
    steps:
      - name: Run one guarded production batch and always disable afterwards
        id: batch
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          APPROVAL: ${{ inputs.approval }}
        run: |
          set +e
          echo "batch_state=error" >> "$GITHUB_OUTPUT"
          echo "cleanup_state=error" >> "$GITHUB_OUTPUT"
          echo "description=Production batch did not run" >> "$GITHUB_OUTPUT"

          finish() {
            echo "batch_state=$1" >> "$GITHUB_OUTPUT"
            echo "description=$2" >> "$GITHUB_OUTPUT"
            exit 0
          }

          cleanup() {
            npx -y @railway/cli@latest variable set \
              LINK_HUNTER_ENABLED=false \
              --service "$SERVICE_ID" \
              --environment "$ENVIRONMENT_ID" \
              >/tmp/link-hunter-production-disable.out 2>/tmp/link-hunter-production-disable.err
            disable_code=$?
            disabled=false
            if [ $disable_code -eq 0 ]; then
              for attempt in $(seq 1 45); do
                body="$(curl -fsS "$PUBLIC_URL/health" 2>/dev/null)"
                BODY="$body" python -c 'import json,os; p=json.loads(os.environ.get("BODY","")); assert p.get("database")=="ok"; assert p.get("link_hunter_enabled") is False' 2>/dev/null
                if [ $? -eq 0 ]; then
                  disabled=true
                  break
                fi
                sleep 10
              done
            fi
            if [ "$disabled" = true ]; then
              echo "cleanup_state=success" >> "$GITHUB_OUTPUT"
            else
              echo "cleanup_state=error" >> "$GITHUB_OUTPUT"
            fi
            rm -f /tmp/link-hunter-production-disable.out /tmp/link-hunter-production-disable.err
          }
          trap cleanup EXIT

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$APPROVAL" != "APPROVE_MAX_0.18_USD" ]; then
            finish "error" "Manual approval phrase did not match; zero paid calls made"
          fi

          body="$(curl -fsS "$PUBLIC_URL/health" 2>/dev/null)"
          BODY="$body" python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["BODY"])
          assert payload.get("database") == "ok"
          assert payload.get("dataforseo_configured") is True
          assert payload.get("link_hunter_enabled") is False
          PY
          if [ $? -ne 0 ]; then
            finish "error" "Production readiness guard failed; zero paid calls made"
          fi

          admin_token_present="$(
            npx -y @railway/cli@latest run --project "$PROJECT_ID" --environment "$ENVIRONMENT_ID" --service "$SERVICE_ID" \
              python -c 'import os; print("yes" if os.getenv("ADMIN_TOKEN") else "")' 2>/dev/null
          )"
          if [ "$admin_token_present" != "yes" ]; then
            finish "error" "Admin control token unavailable; zero paid calls made"
          fi

          dashboard_password="$(
            npx -y @railway/cli@latest run --project "$PROJECT_ID" --environment "$ENVIRONMENT_ID" --service "$SERVICE_ID" \
              python -c 'import os; print(os.getenv("DASHBOARD_PASSWORD", ""))' 2>/dev/null
          )"
          if [ -z "$dashboard_password" ]; then
            finish "error" "Dashboard preview credential unavailable; zero paid calls made"
          fi

          curl -fsS -u "admin:$dashboard_password" \
            "$PUBLIC_URL/admin/link-hunter/proof-preview" \
            >/tmp/link-hunter-production-preview.json 2>/tmp/link-hunter-production-preview.err
          preview_code=$?
          unset dashboard_password
          if [ $preview_code -ne 0 ]; then
            rm -f /tmp/link-hunter-production-preview.json /tmp/link-hunter-production-preview.err
            finish "error" "Zero-cost production preview request failed"
          fi

          preview_summary="$(python - <<'PY'
          import json
          with open('/tmp/link-hunter-production-preview.json', encoding='utf-8') as stream:
              payload = json.load(stream)
          preview = payload.get('preview') or {}
          cost = float(preview.get('estimated_max_cost_usd') or 0.0)
          target_count = int(preview.get('target_count') or 0)
          base_ok = (
              payload.get('provider_calls_made') == 0
              and preview.get('paid_requests_made') == 0
              and preview.get('credentials_exposed') is False
              and preview.get('within_cost_cap') is True
              and cost <= 0.18
          )
          ready = preview.get('ready_for_controlled_proof') is True
          print(json.dumps({
              'base_ok': base_ok,
              'ready': ready,
              'target_count': target_count,
              'cost': cost,
              'blockers': preview.get('activation_blockers') or [],
          }))
          PY
          )"
          rm -f /tmp/link-hunter-production-preview.json /tmp/link-hunter-production-preview.err

          PREVIEW="$preview_summary" python - <<'PY'
          import json
          import os
          payload = json.loads(os.environ['PREVIEW'])
          assert payload['base_ok'] is True
          PY
          if [ $? -ne 0 ]; then
            finish "error" "Preview failed zero-cost or spend-cap guards"
          fi

          target_count="$(PREVIEW="$preview_summary" python -c 'import json,os; print(int(json.loads(os.environ["PREVIEW"])["target_count"]))')"
          if [ "$target_count" -eq 0 ]; then
            finish "success" "No unchecked targets queued; zero paid calls made"
          fi

          PREVIEW="$preview_summary" python - <<'PY'
          import json
          import os
          payload = json.loads(os.environ['PREVIEW'])
          assert payload['ready'] is True
          PY
          if [ $? -ne 0 ]; then
            finish "error" "Preview has activation blockers; zero paid calls made"
          fi

          npx -y @railway/cli@latest variable set \
            LINK_HUNTER_ENABLED=true \
            LINK_HUNTER_PROOF_MAX_COST_USD="$RUN_CAP_USD" \
            LINK_HUNTER_PROOF_BATCH_SIZE=5 \
            LINK_HUNTER_BACKLINKS_PER_DOMAIN=25 \
            --service "$SERVICE_ID" \
            --environment "$ENVIRONMENT_ID" \
            >/tmp/link-hunter-production-enable.out 2>/tmp/link-hunter-production-enable.err
          if [ $? -ne 0 ]; then
            rm -f /tmp/link-hunter-production-enable.out /tmp/link-hunter-production-enable.err
            finish "error" "Feature activation failed before paid batch"
          fi
          rm -f /tmp/link-hunter-production-enable.out /tmp/link-hunter-production-enable.err

          enabled=false
          for attempt in $(seq 1 45); do
            body="$(curl -fsS "$PUBLIC_URL/health" 2>/dev/null)"
            BODY="$body" python -c 'import json,os; p=json.loads(os.environ.get("BODY","")); assert p.get("database")=="ok"; assert p.get("dataforseo_configured") is True; assert p.get("link_hunter_enabled") is True' 2>/dev/null
            if [ $? -eq 0 ]; then
              enabled=true
              break
            fi
            sleep 10
          done
          if [ "$enabled" != true ]; then
            finish "error" "Feature did not become ready; paid batch not called"
          fi

          npx -y @railway/cli@latest run --project "$PROJECT_ID" --environment "$ENVIRONMENT_ID" --service "$SERVICE_ID" \
            python -c 'import os,urllib.request; req=urllib.request.Request(os.environ["PUBLIC_URL"]+"/api/link-hunter/proof",method="POST",headers={"X-Admin-Token":os.environ["ADMIN_TOKEN"]}); print(urllib.request.urlopen(req,timeout=420).read().decode())' \
            >/tmp/link-hunter-production-result.json 2>/tmp/link-hunter-production-result.err
          result_code=$?
          if [ $result_code -ne 0 ]; then
            rm -f /tmp/link-hunter-production-result.json /tmp/link-hunter-production-result.err
            finish "error" "Paid production batch returned an error; cleanup is running"
          fi

          python - <<'PY'
          import json
          import os

          with open('/tmp/link-hunter-production-result.json', encoding='utf-8') as stream:
              payload = json.load(stream)
          counters = payload.get('counters') or {}
          cost = float(counters.get('provider_cost_usd') or 0.0)
          errors = int(counters.get('errors') or 0)
          if payload.get('status') != 'complete':
              raise SystemExit('production batch response was not complete')
          if errors > 0:
              raise SystemExit('production batch reported item/provider errors')
          if cost > 0.18:
              raise SystemExit('provider cost exceeded hard per-run ceiling')
          description = (
              f"Batch complete: ${cost:.4f}; "
              f"{int(counters.get('domains_with_live_backlinks') or 0)} domains with links; "
              f"{int(counters.get('source_links_verified') or 0)} verified"
          )[:140]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('batch_state=success\n')
              stream.write(f'description={description}\n')
          PY
          guard_code=$?
          rm -f /tmp/link-hunter-production-result.json /tmp/link-hunter-production-result.err
          if [ $guard_code -ne 0 ]; then
            finish "error" "Production batch failed the spend/result guard; cleanup is running"
          fi
          exit 0

      - name: Publish production batch statuses
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH_STATE: ${{ steps.batch.outputs.batch_state }}
          CLEANUP_STATE: ${{ steps.batch.outputs.cleanup_state }}
          DESCRIPTION: ${{ steps.batch.outputs.description }}
        run: |
          publish() {
            python - "$1" "$2" "$3" <<'PY' >/tmp/status.json
          import json
          import sys
          print(json.dumps({"state": sys.argv[1], "context": sys.argv[2], "description": sys.argv[3][:140]}))
          PY
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              --data-binary @/tmp/status.json >/dev/null
          }
          publish "$BATCH_STATE" "link-hunter/production-batch" "$DESCRIPTION"
          publish "$CLEANUP_STATE" "link-hunter/production-disabled" "Link Hunter disabled after production batch"

      - name: Audit production safe state after cleanup
        if: always()
        id: audit
        shell: bash
        env:
          BATCH_STATE: ${{ steps.batch.outputs.batch_state }}
          CLEANUP_STATE: ${{ steps.batch.outputs.cleanup_state }}
        run: |
          set +e
          audit_state=error
          description="Production post-run audit did not pass"

          if [ "$BATCH_STATE" != "success" ]; then
            description="Production batch status is not successful"
          elif [ "$CLEANUP_STATE" != "success" ]; then
            description="Production cleanup status is not successful"
          else
            for attempt in $(seq 1 18); do
              body="$(curl -fsS "$PUBLIC_URL/health" 2>/dev/null)"
              BODY="$body" python - <<'PY' 2>/dev/null
          import json
          import os

          payload = json.loads(os.environ.get("BODY", ""))
          assert payload.get("database") == "ok"
          assert payload.get("dataforseo_configured") is True
          assert payload.get("link_hunter_enabled") is False
          PY
              if [ $? -eq 0 ]; then
                audit_state=success
                description="Batch succeeded and production is healthy with paid calls disabled"
                break
              fi
              sleep 10
            done
          fi

          echo "state=$audit_state" >> "$GITHUB_OUTPUT"
          echo "description=$description" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish production post-run audit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_STATE: ${{ steps.audit.outputs.state }}
          DESCRIPTION: ${{ steps.audit.outputs.description }}
        run: |
          python - <<'PY' >/tmp/post-run-status.json
          import json
          import os

          print(json.dumps({
              "state": os.environ.get("AUDIT_STATE") or "error",
              "context": "link-hunter/post-run-audit",
              "description": (os.environ.get("DESCRIPTION") or "Production post-run audit did not complete")[:140],
          }))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/post-run-status.json >/dev/null
