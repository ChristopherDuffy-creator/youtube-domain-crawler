name: Common Crawl First Run Check

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/commoncrawl-first-run-check.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for sanitized Railway-native prefilter summary
        id: result
        shell: bash
        run: |
          set +e
          state=error
          description="Common Crawl first run not observed yet"
          for attempt in $(seq 1 60); do
            body="$(curl -fsS https://youtube-domain-crawler-production.up.railway.app/health 2>/dev/null)"
            parsed="$(BODY="$body" python - <<'PY'
          import json
          import os

          try:
              payload = json.loads(os.environ.get("BODY", ""))
              summary = payload.get("commoncrawl_prefilter")
              if not isinstance(summary, dict):
                  raise ValueError
              status = str(summary.get("status") or "")
              checked = int(summary.get("checked") or 0)
              hits = int(summary.get("with_capture") or 0)
              errors = int(summary.get("errors") or 0)
              cost = float(summary.get("provider_cost_usd") or 0.0)
              if status in {"complete", "partial"} and cost == 0.0:
                  print(f"success|Common Crawl: {checked} checked, {hits} historical hits, {errors} errors, $0")
              else:
                  print("error|Common Crawl summary present but not healthy")
          except Exception:
              print("waiting|not ready")
          PY
          )"
            kind="${parsed%%|*}"
            text="${parsed#*|}"
            if [ "$kind" = success ]; then
              state=success
              description="$text"
              break
            elif [ "$kind" = error ]; then
              state=error
              description="$text"
              break
            fi
            sleep 10
          done
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "description=$description" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish first-run status without failing workflow
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.result.outputs.state }}
          DESCRIPTION: ${{ steps.result.outputs.description }}
        run: |
          python - <<'PY' >/tmp/status.json
          import json
          import os
          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "commoncrawl/railway-native",
              "description": os.environ["DESCRIPTION"][:140],
          }))
          PY
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/status.json >/dev/null
