name: Link Hunter Readiness

# Sanitized production readiness audit; no provider calls and no secret output.
on:
  push:
    branches:
      - main
    paths:
      - app/link_hunter.py
      - app/link_hunter_preview.py
      - app/main.py
      - app/templates/dashboard.html
      - .github/workflows/controlled-link-hunter-proof.yml
      - .github/workflows/link-hunter-production-batch.yml
      - .github/workflows/link-hunter-post-proof-audit.yml
      - .github/workflows/link-hunter-readiness.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for sanitized production readiness
        id: health
        shell: bash
        run: |
          set +e
          db_state=error
          flag_state=error
          creds_state=error

          for attempt in $(seq 1 30); do
            body="$(curl -fsS https://youtube-domain-crawler-production.up.railway.app/health 2>/dev/null)"
            if [ $? -eq 0 ]; then
              states="$(BODY="$body" python - <<'PY'
          import json
          import os

          try:
              payload = json.loads(os.environ["BODY"])
          except Exception:
              print("error error error")
          else:
              db = "success" if payload.get("database") == "ok" else "error"
              flag = "success" if payload.get("link_hunter_enabled") is False else "error"
              creds = "success" if payload.get("dataforseo_configured") is True else "error"
              print(db, flag, creds)
          PY
              )"
              read -r db_state flag_state creds_state <<< "$states"
              if [ "$db_state" = success ] && [ "$flag_state" = success ] && [ "$creds_state" = success ]; then
                break
              fi
            fi
            sleep 20
          done

          echo "db_state=$db_state" >> "$GITHUB_OUTPUT"
          echo "flag_state=$flag_state" >> "$GITHUB_OUTPUT"
          echo "creds_state=$creds_state" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish readiness statuses
        env:
          GH_TOKEN: ${{ github.token }}
          DB_STATE: ${{ steps.health.outputs.db_state }}
          FLAG_STATE: ${{ steps.health.outputs.flag_state }}
          CREDS_STATE: ${{ steps.health.outputs.creds_state }}
        run: |
          publish() {
            state="$1"
            context="$2"
            description="$3"
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "{\"state\":\"$state\",\"context\":\"$context\",\"description\":\"$description\"}"
          }

          publish "$DB_STATE" "link-hunter/database" "Production database health"
          publish "$FLAG_STATE" "link-hunter/disabled" "Link Hunter paid calls currently disabled"
          publish "$CREDS_STATE" "link-hunter/dataforseo" "DataForSEO credentials visible to production"
