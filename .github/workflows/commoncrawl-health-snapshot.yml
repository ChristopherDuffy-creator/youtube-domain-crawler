name: Common Crawl Health Snapshot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/commoncrawl-health-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Read sanitized production summary
        id: summary
        shell: bash
        run: |
          set +e
          body="$(curl -fsS https://youtube-domain-crawler-production.up.railway.app/health 2>/dev/null)"
          BODY="$body" python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          try:
              payload = json.loads(os.environ.get("BODY", ""))
              summary = payload.get("commoncrawl_prefilter")
              scheduler = bool(payload.get("scheduler"))
              if not isinstance(summary, dict):
                  print("state=error")
                  print(f"context=commoncrawl/snapshot-scheduler-{str(scheduler).lower()}-no-summary")
                  raise SystemExit
              status = str(summary.get("status") or "unknown").replace("/", "-")
              checked = int(summary.get("checked") or 0)
              hits = int(summary.get("with_capture") or 0)
              errors = int(summary.get("errors") or 0)
              cost = float(summary.get("provider_cost_usd") or 0.0)
              state = "success" if status in {"complete", "partial"} and cost == 0.0 else "error"
              print(f"state={state}")
              print(f"context=commoncrawl/snapshot-{status}-c{checked}-h{hits}-e{errors}-usd{cost:.2f}")
          except SystemExit:
              pass
          except Exception:
              print("state=error")
              print("context=commoncrawl/snapshot-health-unreadable")
          PY
          exit 0

      - name: Publish aggregate snapshot without failing workflow
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.summary.outputs.state }}
          CONTEXT: ${{ steps.summary.outputs.context }}
        run: |
          python - <<'PY' >/tmp/status.json
          import json
          import os
          print(json.dumps({
              "state": os.environ.get("STATE", "error"),
              "context": os.environ.get("CONTEXT", "commoncrawl/snapshot-missing")[:100],
              "description": "Sanitized Railway-native Common Crawl health snapshot",
          }))
          PY
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/status.json >/dev/null
