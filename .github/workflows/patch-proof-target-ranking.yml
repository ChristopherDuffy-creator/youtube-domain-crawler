name: Patch Proof Target Ranking

on:
  push:
    branches:
      - phase-c-proof-target-ranking
    paths:
      - .github/workflows/patch-proof-target-ranking.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-c-proof-target-ranking
      - name: Make actual paid proof use preview target selector
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/link_hunter.py')
          text = path.read_text(encoding='utf-8')

          old_import = 'from app.dataforseo import DataForSEOClient, DataForSEOError\n'
          new_import = (
              'from app.dataforseo import DataForSEOClient, DataForSEOError\n'
              'from app.link_hunter_preview import select_provider_proof_targets\n'
          )
          if old_import not in text:
              raise SystemExit('expected DataForSEO import not found')
          text = text.replace(old_import, new_import, 1)

          old_models = '''    Domain,\n    DroppedDomain,\n    FetchVerification,\n'''
          new_models = '''    Domain,\n    FetchVerification,\n'''
          if old_models not in text:
              raise SystemExit('expected DroppedDomain model import not found')
          text = text.replace(old_models, new_models, 1)

          old_selection = '''    already_checked = set(\n        db.scalars(\n            select(ProviderQuery.target).where(\n                ProviderQuery.provider == "dataforseo",\n                ProviderQuery.endpoint == "bulk_backlink_summary",\n                ProviderQuery.status == "complete",\n            )\n        ).all()\n    )\n    recent_drops = db.scalars(\n        select(DroppedDomain).order_by(DroppedDomain.first_seen_at.desc()).limit(250)\n    ).all()\n    targets = [drop.name for drop in recent_drops if drop.name not in already_checked][\n        : settings.link_hunter_proof_batch_size\n    ]\n'''
          new_selection = '''    # Use the exact same free/cached target selector shown by the zero-cost\n    # dashboard preview. This prevents a paid proof from silently testing a\n    # different set of domains than the operator reviewed.\n    targets = select_provider_proof_targets(db, settings)\n'''
          if old_selection not in text:
              raise SystemExit('expected legacy proof selection block not found')
          text = text.replace(old_selection, new_selection, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/link_hunter.py
          git diff --cached --check
          git commit -m "Use ranked targets in actual provider proof"
          git push origin HEAD:phase-c-proof-target-ranking
