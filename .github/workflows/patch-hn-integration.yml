name: Patch Hacker News Integration

on:
  push:
    branches:
      - phase-d-hackernews-prefilter
    paths:
      - .github/workflows/patch-hn-integration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-d-hackernews-prefilter
      - name: Integrate free Hacker News prefilter
        run: |
          python - <<'PY'
          from pathlib import Path

          jobs = Path('app/jobs.py')
          text = jobs.read_text(encoding='utf-8')
          old_import = 'from app.metrics import ViewMetric, calculate_monthly_views\n'
          new_import = (
              'from app.hackernews_prefilter import run_hackernews_prefilter as run_hackernews_prefilter_batch\n'
              'from app.metrics import ViewMetric, calculate_monthly_views\n'
          )
          if old_import not in text:
              raise SystemExit('jobs import marker missing')
          text = text.replace(old_import, new_import, 1)

          marker = '\n\nJOB_FUNCTIONS: dict[str, Callable[[], None]] = {\n'
          job = '''\n\ndef run_hackernews_prefilter_job() -> None:\n    """Cache free exact-link evidence from Hacker News stories/comments."""\n    with SessionLocal() as db:\n        run = _start_run(db, "hackernews_prefilter")\n        counters: dict[str, Any] = {\n            "candidates": 0,\n            "queries": 0,\n            "search_hits": 0,\n            "items_with_exact_links": 0,\n            "exact_links_saved": 0,\n            "new_links": 0,\n            "domains_with_links": 0,\n            "provider_cost_usd": 0.0,\n            "errors": 0,\n            "error_details": [],\n        }\n        try:\n            counters = run_hackernews_prefilter_batch(db, batch_size=10, hits_per_page=50)\n            status = "complete" if not counters.get("errors") else "partial"\n            _finish_run(db, run, status, counters)\n        except Exception as exc:\n            db.rollback()\n            run = db.get(RunLog, run.id)\n            _finish_run(db, run, "failed", counters, str(exc))\n            logger.exception("Hacker News prefilter failed")\n'''
          if marker not in text:
              raise SystemExit('JOB_FUNCTIONS marker missing')
          text = text.replace(marker, job + marker, 1)

          old_entry = '    "stackexchange_prefilter": run_stackexchange_prefilter_job,\n    "digest": run_daily_digest,\n'
          new_entry = (
              '    "stackexchange_prefilter": run_stackexchange_prefilter_job,\n'
              '    "hackernews_prefilter": run_hackernews_prefilter_job,\n'
              '    "digest": run_daily_digest,\n'
          )
          if old_entry not in text:
              raise SystemExit('JOB_FUNCTIONS insertion marker missing')
          text = text.replace(old_entry, new_entry, 1)

          old_initial = '''    scheduler.add_job(\n        run_stackexchange_prefilter_job,\n        DateTrigger(run_date=start + timedelta(minutes=9)),\n        id="initial_stackexchange_prefilter",\n        replace_existing=True,\n    )\n'''
          new_initial = old_initial + '''    scheduler.add_job(\n        run_hackernews_prefilter_job,\n        DateTrigger(run_date=start + timedelta(minutes=12)),\n        id="initial_hackernews_prefilter",\n        replace_existing=True,\n    )\n'''
          if old_initial not in text:
              raise SystemExit('initial Stack Exchange marker missing')
          text = text.replace(old_initial, new_initial, 1)

          old_recurring = '''    scheduler.add_job(\n        run_stackexchange_prefilter_job,\n        CronTrigger(hour="2,14", minute=27, timezone="UTC"),\n        id="stackexchange_prefilter",\n        replace_existing=True,\n    )\n'''
          new_recurring = old_recurring + '''    scheduler.add_job(\n        run_hackernews_prefilter_job,\n        CronTrigger(hour="3,15", minute=37, timezone="UTC"),\n        id="hackernews_prefilter",\n        replace_existing=True,\n    )\n'''
          if old_recurring not in text:
              raise SystemExit('recurring Stack Exchange marker missing')
          text = text.replace(old_recurring, new_recurring, 1)
          jobs.write_text(text, encoding='utf-8')

          main = Path('app/main.py')
          text = main.read_text(encoding='utf-8')
          old_head = '''    commoncrawl_summary: dict[str, object] | None = None\n    stackexchange_summary: dict[str, object] | None = None\n    try:\n'''
          new_head = '''    commoncrawl_summary: dict[str, object] | None = None\n    stackexchange_summary: dict[str, object] | None = None\n    hackernews_summary: dict[str, object] | None = None\n    try:\n'''
          if old_head not in text:
              raise SystemExit('health header marker missing')
          text = text.replace(old_head, new_head, 1)

          old_tail = '''                ),\n            }\n    except Exception:\n        database = "error"\n    return {\n'''
          new_tail = '''                ),\n            }\n        last_hackernews = db.scalar(\n            select(RunLog)\n            .where(RunLog.job == "hackernews_prefilter")\n            .order_by(RunLog.started_at.desc())\n            .limit(1)\n        )\n        if last_hackernews is not None:\n            counters = last_hackernews.counters or {}\n            hackernews_summary = {\n                "status": last_hackernews.status,\n                "queries": int(counters.get("queries") or 0),\n                "search_hits": int(counters.get("search_hits") or 0),\n                "items_with_exact_links": int(counters.get("items_with_exact_links") or 0),\n                "exact_links_saved": int(counters.get("exact_links_saved") or 0),\n                "domains_with_links": int(counters.get("domains_with_links") or 0),\n                "errors": int(counters.get("errors") or 0),\n                "provider_cost_usd": float(counters.get("provider_cost_usd") or 0.0),\n                "finished_at": (\n                    last_hackernews.finished_at.isoformat()\n                    if last_hackernews.finished_at is not None\n                    else None\n                ),\n            }\n    except Exception:\n        database = "error"\n    return {\n'''
          if old_tail not in text:
              raise SystemExit('health insertion marker missing')
          text = text.replace(old_tail, new_tail, 1)

          old_return = '''        "stackexchange_prefilter": stackexchange_summary,\n        "time": datetime.now(UTC).isoformat(),\n'''
          new_return = '''        "stackexchange_prefilter": stackexchange_summary,\n        "hackernews_prefilter": hackernews_summary,\n        "time": datetime.now(UTC).isoformat(),\n'''
          if old_return not in text:
              raise SystemExit('health return marker missing')
          text = text.replace(old_return, new_return, 1)
          main.write_text(text, encoding='utf-8')
          PY

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/jobs.py app/main.py
          git diff --cached --check
          git commit -m "Schedule free Hacker News prefilter"
          git push origin HEAD:phase-d-hackernews-prefilter
