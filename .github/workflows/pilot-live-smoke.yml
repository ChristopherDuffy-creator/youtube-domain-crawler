name: Pilot Live Smoke

on:
  push:
    branches:
      - pilot/three-site-validation
    paths:
      - .github/workflows/pilot-live-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test final public pilot behavior
        shell: bash
        run: |
          set +e
          failures=0
          bust="smoke=$(date +%s%N)"
          check_code() {
            url="$1"; expected="$2"; label="$3"
            sep='?'; case "$url" in *\?*) sep='&';; esac
            code=$(curl --max-time 25 -sS -H 'Cache-Control: no-cache' -o /tmp/pilot-body -w '%{http_code}' "${url}${sep}${bust}" || echo ERR)
            bytes=$(wc -c </tmp/pilot-body 2>/dev/null || echo 0)
            echo "$label -> $code bytes=$bytes"
            if [ "$code" != "$expected" ]; then failures=$((failures+1)); fi
          }

          for domain in craftsheaven.club satvic.yoga teamgerardiperformance.com; do
            echo "=== $domain ==="
            check_code "https://$domain/" 200 "$domain home"
            check_code "https://$domain/privacy" 200 "$domain privacy"
            check_code "https://$domain/go/main" 200 "$domain internal recommendation guide"
            check_code "https://$domain/robots.txt" 200 "$domain robots"
          done

          echo "=== Crafts legacy intent ==="
          check_code "https://craftsheaven.club/woodworkingplans" 200 "crafts old /woodworkingplans"
          check_code "https://craftsheaven.club/woodworking-plans" 200 "crafts old /woodworking-plans"
          check_code "https://craftsheaven.club/sitemap.xml" 200 "crafts sitemap"

          echo "=== Satvic indexable ==="
          check_code "https://satvic.yoga/sitemap.xml" 200 "satvic sitemap"

          echo "=== Team Gerardi cautious indexing ==="
          check_code "https://teamgerardiperformance.com/sitemap.xml" 404 "team sitemap intentionally absent"
          body=$(curl --max-time 25 -fsS -H 'Cache-Control: no-cache' "https://teamgerardiperformance.com/?${bust}" || true)
          if printf '%s' "$body" | grep -q 'name="robots" content="noindex,follow"'; then
            echo "team noindex -> PASS"
          else
            echo "team noindex -> FAIL"
            failures=$((failures+1))
          fi
          if printf '%s' "$body" | grep -q 'Not affiliated with, endorsed by, or operated by Gerardi Performance'; then
            echo "team independence disclosure -> PASS"
          else
            echo "team independence disclosure -> FAIL"
            failures=$((failures+1))
          fi

          echo "SMOKE_FAILURES=$failures"
          if [ "$failures" -ne 0 ]; then
            echo "::warning::Pilot semantic smoke found $failures problem(s)."
          fi
          exit 0
