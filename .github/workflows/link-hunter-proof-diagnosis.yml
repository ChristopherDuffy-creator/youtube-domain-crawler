name: Link Hunter Proof Diagnosis

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/link-hunter-proof-diagnosis.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Install PostgreSQL client
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4'
      - name: Read latest Link Hunter proof outcome only
        run: |
          npx -y @railway/cli@latest run \
            --project 31fbe878-aa83-4b74-9820-e9f0d13b984c \
            --environment production \
            --service youtube-domain-crawler \
            -- python -c '
          import os
          import psycopg
          connection = psycopg.connect(os.environ["DATABASE_URL"])
          cursor = connection.cursor()
          cursor.execute("SET TRANSACTION READ ONLY")
          cursor.execute(
              "SELECT status, error, counters::text, started_at, finished_at "
              "FROM run_logs WHERE job = %s ORDER BY started_at DESC LIMIT 3",
              ("link_hunter_proof",),
          )
          for row in cursor.fetchall():
              error = row[1] or ""
              counters = row[2] or ""
              print(dict(
                  status=row[0],
                  error_present=bool(error),
                  error_class=error.split(":")[0].split("\\n")[0][:160],
                  has_daily_budget="daily_budget" in counters,
                  counter_length=len(counters),
                  started_at=str(row[3]),
                  finished_at=str(row[4]),
              ))
          connection.close()
          '
