name: Controlled Link Hunter Proof

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Type APPROVE_MAX_0.18_USD to request one paid proof"
        required: true
        type: string

permissions:
  contents: read
  actions: write
  statuses: write

concurrency:
  group: link-hunter-paid-proof-request
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the single guarded production endpoint path
        id: request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL: ${{ inputs.approval }}
        run: |
          set +e
          echo "state=error" >> "$GITHUB_OUTPUT"
          echo "description=Controlled proof was not requested" >> "$GITHUB_OUTPUT"

          if [ "$APPROVAL" != "APPROVE_MAX_0.18_USD" ]; then
            echo "description=Approval phrase did not match; zero paid calls made" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - <<'PY' >/tmp/dispatch.json
          import json
          print(json.dumps({
              "ref": "main",
              "inputs": {"approval": "APPROVE_MAX_0.18_USD"},
          }))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/link-hunter-production-batch.yml/dispatches" \
            --data-binary @/tmp/dispatch.json
          dispatch_code=$?
          rm -f /tmp/dispatch.json
          if [ $dispatch_code -ne 0 ]; then
            echo "description=Production proof dispatch failed; zero paid calls made" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "state=success" >> "$GITHUB_OUTPUT"
          echo "description=Dispatched the guarded $0.18 proof endpoint" >> "$GITHUB_OUTPUT"

      - name: Publish request status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.request.outputs.state }}
          DESCRIPTION: ${{ steps.request.outputs.description }}
        run: |
          python - <<'PY' >/tmp/status.json
          import json
          import os

          print(json.dumps({
              "state": os.environ.get("STATE") or "error",
              "context": "link-hunter/paid-proof-request",
              "description": (os.environ.get("DESCRIPTION") or "Proof request did not complete")[:140],
          }))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/status.json >/dev/null
