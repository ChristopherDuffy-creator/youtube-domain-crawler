name: Railway CLI Deploy

# Direct source upload fallback for Railway GitHub snapshot failures.
# Verify health plus full authenticated ASGI rendering for both dashboard views.
# Full dashboard pipeline diagnostic deployment trigger.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/railway-cli-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: railway-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Require project-scoped Railway token
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN repository secret is not configured"
            exit 1
          fi

      - name: Upload current main source directly to Railway
        run: >-
          npx -y @railway/cli@latest up
          --project 31fbe878-aa83-4b74-9820-e9f0d13b984c
          --environment production
          --service youtube-domain-crawler
          --ci

      - name: Verify live health and authenticated dashboard pipelines
        run: |
          last_body=""
          last_youtube=""
          last_web=""
          for attempt in $(seq 1 30); do
            body="$(curl -fsS https://youtube-domain-crawler-production.up.railway.app/health || true)"
            youtube="$(curl -sS 'https://youtube-domain-crawler-production.up.railway.app/ops/dashboard-smoke?view=youtube&pipeline=asgi' || true)"
            web="$(curl -sS 'https://youtube-domain-crawler-production.up.railway.app/ops/dashboard-smoke?view=web&pipeline=asgi' || true)"
            last_body="$body"
            last_youtube="$youtube"
            last_web="$web"
            health_ok=0
            youtube_ok=0
            web_ok=0
            if BODY="$body" python -c 'import json, os; p=json.loads(os.environ["BODY"]); assert p.get("database") == "ok"; assert p.get("link_hunter_enabled") is True' 2>/dev/null; then health_ok=1; fi
            if DIAG="$youtube" python -c 'import json, os; p=json.loads(os.environ["DIAG"]); assert p.get("ok") is True; assert p.get("status_code") == 200' 2>/dev/null; then youtube_ok=1; fi
            if DIAG="$web" python -c 'import json, os; p=json.loads(os.environ["DIAG"]); assert p.get("ok") is True; assert p.get("status_code") == 200' 2>/dev/null; then web_ok=1; fi
            if [ "$health_ok" = "1" ] && [ "$youtube_ok" = "1" ] && [ "$web_ok" = "1" ]; then
              echo "$body"
              echo "YouTube diagnostic: $youtube"
              echo "Web diagnostic: $web"
              exit 0
            fi
            echo "Waiting ($attempt/30): health=$health_ok youtube=$youtube_ok web=$web_ok"
            echo "YouTube diagnostic: $youtube"
            echo "Web diagnostic: $web"
            sleep 10
          done
          echo "Production verification failed"
          echo "Last health: $last_body"
          echo "Last YouTube diagnostic: $last_youtube"
          echo "Last Web diagnostic: $last_web"
          exit 1

      - name: Publish Railway deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            state=success
            description="Railway deploy and both authenticated dashboards passed"
          else
            state=failure
            description="Railway deploy or authenticated dashboard smoke failed"
          fi
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"railway/production\",\"description\":\"${description}\"}"
