name: Railway CLI Deploy

# Direct source upload fallback for Railway GitHub snapshot failures.
# This workflow verifies production health plus a live-data dashboard renderer
# smoke test, not merely the unauthenticated login redirect.
# Authenticated-dashboard 500 diagnostic deployment trigger.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/railway-cli-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: railway-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Require project-scoped Railway token
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN repository secret is not configured"
            exit 1
          fi

      - name: Upload current main source directly to Railway
        run: >-
          npx -y @railway/cli@latest up
          --project 31fbe878-aa83-4b74-9820-e9f0d13b984c
          --environment production
          --service youtube-domain-crawler
          --ci

      - name: Verify live production health and real dashboard renderer
        run: |
          last_body=""
          last_diag=""
          for attempt in $(seq 1 30); do
            body="$(curl -fsS https://youtube-domain-crawler-production.up.railway.app/health || true)"
            diag="$(curl -sS https://youtube-domain-crawler-production.up.railway.app/ops/youtube-dashboard-smoke || true)"
            last_body="$body"
            last_diag="$diag"
            health_ok=0
            diag_ok=0
            if BODY="$body" python -c 'import json, os; p=json.loads(os.environ["BODY"]); assert p.get("database") == "ok"; assert p.get("link_hunter_enabled") is True; y=p.get("youtube") or {}; assert "domain_signals" in (y.get("totals") or {}); assert "stats_remaining" in (y.get("quota") or {}); assert isinstance(p.get("email"), dict)' 2>/dev/null; then
              health_ok=1
            fi
            if DIAG="$diag" python -c 'import json, os; p=json.loads(os.environ["DIAG"]); assert p.get("ok") is True; assert int(p.get("status_code", 0)) == 200; assert int(p.get("body_bytes", 0)) > 0' 2>/dev/null; then
              diag_ok=1
            fi
            if [ "$health_ok" = "1" ] && [ "$diag_ok" = "1" ]; then
              echo "$body"
              echo "$diag"
              exit 0
            fi
            echo "Waiting for production health/renderer ($attempt/30): health_ok=$health_ok diag_ok=$diag_ok"
            if [ -n "$diag" ]; then
              echo "Dashboard diagnostic: $diag"
            fi
            sleep 10
          done
          echo "Production verification failed"
          echo "Last health body: $last_body"
          echo "Last dashboard diagnostic: $last_diag"
          exit 1

      - name: Publish Railway deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            state=success
            description="Railway deploy, health and live dashboard renderer passed"
          else
            state=failure
            description="Railway deploy/health/live dashboard renderer failed"
          fi
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"railway/production\",\"description\":\"${description}\"}"
