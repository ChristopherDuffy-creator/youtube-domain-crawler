name: Resume Guarded Crawler Scheduler

# One-purpose recovery control after verified storage expansion. It is path-gated
# so normal source changes cannot restart scheduled crawler work.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/resume-crawler-scheduler-guarded.yml

permissions:
  contents: read

concurrency:
  group: crawler-scheduler-guarded-resume
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      APPROVAL_MARKER: RESUME_GUARDED_CRAWLER_20260825
    steps:
      - name: Require the guarded-resume marker
        run: |
          test "$APPROVAL_MARKER" = "RESUME_GUARDED_CRAWLER_20260825"
          test -n "$RAILWAY_TOKEN"

      - name: Enable only the in-process crawler scheduler
        run: >-
          npx -y @railway/cli@latest variable set SCHEDULER_ENABLED=true
          --project 31fbe878-aa83-4b74-9820-e9f0d13b984c
          --environment production
          --service youtube-domain-crawler
          --json

      - name: Verify the guarded scheduler reached production
        run: |
          for attempt in $(seq 1 30); do
            body="$(curl --max-time 20 -fsS https://youtube-domain-crawler-production.up.railway.app/health || true)"
            if BODY="$body" python -c 'import json, os; p=json.loads(os.environ["BODY"]); storage=p.get("database_storage") or {}; assert p.get("status") == "ok"; assert p.get("database") == "ok"; assert p.get("scheduler") is True; assert storage.get("enabled") is True; assert storage.get("blocked") is False; assert p.get("link_hunter_enabled") is True' 2>/dev/null; then
              echo "$body"
              exit 0
            fi
            echo "Waiting for guarded crawler scheduler ($attempt/30)"
            sleep 10
          done
          echo "Crawler scheduler did not resume with storage protection"
          exit 1
