name: Activate Approved Link Hunter

# This is intentionally a one-purpose production change. It is path-gated so
# normal source changes cannot turn on paid crawling.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/activate-link-hunter-approved.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-hunter-approved-activation
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      APPROVAL_MARKER: APPROVE_LINK_HUNTER_ACTIVATION_20260825
    steps:
      - name: Require approved production activation
        run: |
          test "$APPROVAL_MARKER" = "APPROVE_LINK_HUNTER_ACTIVATION_20260825"
          test -n "$RAILWAY_TOKEN"

      - name: Enable only the guarded Link Hunter feature flag
        run: >-
          npx -y @railway/cli@latest variable set LINK_HUNTER_ENABLED=true
          --project 31fbe878-aa83-4b74-9820-e9f0d13b984c
          --environment production
          --service youtube-domain-crawler
          --json

      - name: Verify live safe activation
        run: |
          for attempt in $(seq 1 30); do
            body="$(curl --max-time 20 -fsS https://youtube-domain-crawler-production.up.railway.app/health || true)"
            if BODY="$body" python -c 'import json, os; p=json.loads(os.environ["BODY"]); assert p.get("status") == "ok"; assert p.get("database") == "ok"; assert p.get("dataforseo_configured") is True; assert p.get("link_hunter_enabled") is True' 2>/dev/null; then
              echo "$body"
              exit 0
            fi
            echo "Waiting for guarded Link Hunter activation ($attempt/30)"
            sleep 10
          done
          echo "Guarded Link Hunter activation did not become healthy"
          exit 1
