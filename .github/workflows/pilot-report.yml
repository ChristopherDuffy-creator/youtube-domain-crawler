name: Pilot Performance Report

on:
  push:
    branches:
      - pilot/three-site-validation
    paths:
      - .github/workflows/pilot-report.yml
  workflow_dispatch:
    inputs:
      since:
        description: Optional ISO-8601 baseline
        required: false
        type: string

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read pilot traffic and click metrics
        shell: bash
        run: |
          set +e
          since="${{ inputs.since }}"
          if [ -n "$since" ]; then
            npx -y @railway/cli@latest run \
              --project 31fbe878-aa83-4b74-9820-e9f0d13b984c \
              --environment production \
              --service youtube-domain-crawler \
              --no-local \
              python -m scripts.pilot_report --since "$since"
          else
            npx -y @railway/cli@latest run \
              --project 31fbe878-aa83-4b74-9820-e9f0d13b984c \
              --environment production \
              --service youtube-domain-crawler \
              --no-local \
              python -m scripts.pilot_report
          fi
          exit 0
