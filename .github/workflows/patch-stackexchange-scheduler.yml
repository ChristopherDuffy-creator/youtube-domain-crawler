name: Patch Stack Exchange Scheduler

on:
  push:
    branches:
      - phase-d-stackexchange-prefilter
    paths:
      - .github/workflows/patch-stackexchange-scheduler.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-d-stackexchange-prefilter
      - name: Add free Stack Exchange scheduler job
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/jobs.py')
          text = path.read_text(encoding='utf-8')

          old_import = 'from app.scoring import ScoreInputs, calculate_score, determine_tier\n'
          new_import = (
              'from app.scoring import ScoreInputs, calculate_score, determine_tier\n'
              'from app.stackexchange_prefilter import run_stackexchange_prefilter as run_stackexchange_prefilter_batch\n'
          )
          if old_import not in text:
              raise SystemExit('scoring import marker not found')
          text = text.replace(old_import, new_import, 1)

          marker = '\n\nJOB_FUNCTIONS: dict[str, Callable[[], None]] = {\n'
          job = '''\n\ndef run_stackexchange_prefilter_job() -> None:\n    """Cache free exact-link evidence from high-view Stack Exchange questions."""\n    settings = get_settings()\n    with SessionLocal() as db:\n        run = _start_run(db, "stackexchange_prefilter")\n        counters: dict[str, Any] = {\n            "candidates": 0,\n            "queries": 0,\n            "questions_matched": 0,\n            "exact_links_saved": 0,\n            "new_links": 0,\n            "domains_with_links": 0,\n            "quota_remaining": None,\n            "backoff_events": 0,\n            "provider_cost_usd": 0.0,\n            "errors": 0,\n            "error_details": [],\n        }\n        try:\n            counters = run_stackexchange_prefilter_batch(\n                db,\n                batch_size=settings.stackexchange_prefilter_batch_size,\n                sites=tuple(settings.stackexchange_sites),\n                min_views=settings.stackexchange_min_views,\n            )\n            status = "complete" if not counters.get("errors") else "partial"\n            _finish_run(db, run, status, counters)\n        except Exception as exc:\n            db.rollback()\n            run = db.get(RunLog, run.id)\n            _finish_run(db, run, "failed", counters, str(exc))\n            logger.exception("Stack Exchange prefilter failed")\n'''
          if marker not in text:
              raise SystemExit('JOB_FUNCTIONS marker not found')
          text = text.replace(marker, job + marker, 1)

          old_entry = '    "commoncrawl_prefilter": run_commoncrawl_prefilter_job,\n    "digest": run_daily_digest,\n'
          new_entry = (
              '    "commoncrawl_prefilter": run_commoncrawl_prefilter_job,\n'
              '    "stackexchange_prefilter": run_stackexchange_prefilter_job,\n'
              '    "digest": run_daily_digest,\n'
          )
          if old_entry not in text:
              raise SystemExit('JOB_FUNCTIONS insertion marker not found')
          text = text.replace(old_entry, new_entry, 1)

          old_initial = '''    scheduler.add_job(\n        run_commoncrawl_prefilter_job,\n        DateTrigger(run_date=start + timedelta(minutes=6)),\n        id="initial_commoncrawl_prefilter",\n        replace_existing=True,\n    )\n'''
          new_initial = old_initial + '''    scheduler.add_job(\n        run_stackexchange_prefilter_job,\n        DateTrigger(run_date=start + timedelta(minutes=9)),\n        id="initial_stackexchange_prefilter",\n        replace_existing=True,\n    )\n'''
          if old_initial not in text:
              raise SystemExit('initial Common Crawl job not found')
          text = text.replace(old_initial, new_initial, 1)

          old_recurring = '''    scheduler.add_job(\n        run_commoncrawl_prefilter_job,\n        CronTrigger(hour="1,13", minute=17, timezone="UTC"),\n        id="commoncrawl_prefilter",\n        replace_existing=True,\n    )\n'''
          new_recurring = old_recurring + '''    scheduler.add_job(\n        run_stackexchange_prefilter_job,\n        CronTrigger(hour="2,14", minute=27, timezone="UTC"),\n        id="stackexchange_prefilter",\n        replace_existing=True,\n    )\n'''
          if old_recurring not in text:
              raise SystemExit('recurring Common Crawl job not found')
          text = text.replace(old_recurring, new_recurring, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit scheduler integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/jobs.py
          git diff --cached --check
          git commit -m "Schedule free Stack Exchange prefilter"
          git push origin HEAD:phase-d-stackexchange-prefilter
