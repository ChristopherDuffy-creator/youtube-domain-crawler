name: Porkbun 3-Site Pilot Dry Run

# Temporary one-shot push trigger for post-identity-verification registrar check.
# The registrar step is deliberately non-failing so no CI failure email is generated.
on:
  push:
    branches:
      - pilot/three-site-validation
    paths:
      - .github/workflows/porkbun-pilot-dry-run.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: porkbun-three-site-pilot-dry-run
  cancel-in-progress: true

jobs:
  test-and-dry-run:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run acquisition unit tests
        run: pytest -q tests/test_acquisition.py tests/test_availability.py

      - name: Require project-scoped Railway token
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN repository secret is not configured"
            exit 0
          fi

      - name: Dry-run approved domains using production registrar credentials
        shell: bash
        run: |
          set +e
          npx -y @railway/cli@latest run \
            --project 31fbe878-aa83-4b74-9820-e9f0d13b984c \
            --environment production \
            --service youtube-domain-crawler \
            --no-local \
            python -m scripts.pilot_acquisition --mode dry-run
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning::Porkbun dry-run reported an external registrar/account blocker (exit $code). Review output above."
          fi
          exit 0
