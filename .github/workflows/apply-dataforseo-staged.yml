name: Apply DataForSEO Staged Variables

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-dataforseo-staged.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: railway-production-config
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_ENVIRONMENT_ID: 9f670e7a-1b3d-4ccc-b450-092a70403ee9
      RAILWAY_SERVICE_ID: 8aa9b741-7a20-4aef-8baf-c25ac82f6fce
      PROJECT_ID: 31fbe878-aa83-4b74-9820-e9f0d13b984c
    steps:
      - uses: actions/checkout@v4

      - name: Inspect and commit exact staged variable patch through Railway CLI
        id: apply
        shell: bash
        run: |
          set +e
          echo "committed=false" >> "$GITHUB_OUTPUT"
          echo "already_ready=false" >> "$GITHUB_OUTPUT"
          echo "top_ok=false" >> "$GITHUB_OUTPUT"
          echo "service_ok=false" >> "$GITHUB_OUTPUT"
          echo "section_ok=false" >> "$GITHUB_OUTPUT"
          echo "vars_ok=false" >> "$GITHUB_OUTPUT"

          body="$(curl -fsS https://youtube-domain-crawler-production.up.railway.app/health || true)"
          BODY="$body" python -c 'import json,os; p=json.loads(os.environ["BODY"]); assert p.get("database")=="ok" and p.get("dataforseo_configured") is True' 2>/dev/null
          if [ $? -eq 0 ]; then
            echo "already_ready=true" >> "$GITHUB_OUTPUT"
            echo "top_ok=true" >> "$GITHUB_OUTPUT"
            echo "service_ok=true" >> "$GITHUB_OUTPUT"
            echo "section_ok=true" >> "$GITHUB_OUTPUT"
            echo "vars_ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat > /tmp/staged.graphql <<'GRAPHQL'
          query EnvironmentStagedChanges($environmentId: String!) {
            environmentStagedChanges(environmentId: $environmentId) { id status patch }
          }
          GRAPHQL

          npx -y @railway/cli@latest api \
            --file /tmp/staged.graphql \
            --raw-var "environmentId=$RAILWAY_ENVIRONMENT_ID" \
            --compact > /tmp/staged.json 2>/tmp/staged.err
          if [ $? -ne 0 ]; then
            echo "Railway CLI could not query staged changes (response suppressed)"
            exit 0
          fi

          python - <<'PY'
          import json
          import os

          out = os.environ["GITHUB_OUTPUT"]
          def put(key, value):
              with open(out, "a", encoding="utf-8") as stream:
                  stream.write(f"{key}={'true' if value else 'false'}\n")

          with open("/tmp/staged.json", encoding="utf-8") as stream:
              response = json.load(stream)
          patch = (response.get("data", {}).get("environmentStagedChanges") or {}).get("patch") or {}
          service_id = os.environ["RAILWAY_SERVICE_ID"]
          expected = {"DATAFORSEO_LOGIN", "DATAFORSEO_PASSWORD"}

          nonempty_top = {k for k, v in patch.items() if v not in (None, {}, [], "")} if isinstance(patch, dict) else set()
          services = patch.get("services") if isinstance(patch, dict) else {}
          services = services if isinstance(services, dict) else {}
          service = services.get(service_id) or {}
          nonempty_service = {k for k, v in service.items() if v not in (None, {}, [], "")} if isinstance(service, dict) else set()
          variables = service.get("variables") if isinstance(service, dict) else {}
          variables = variables if isinstance(variables, dict) else {}

          put("top_ok", nonempty_top == {"services"})
          put("service_ok", set(services) == {service_id})
          put("section_ok", nonempty_service == {"variables"})
          put("vars_ok", set(variables) == expected)
          PY

          # Refuse the mutation unless every structural check passed.
          source "$GITHUB_OUTPUT" 2>/dev/null || true
          top_ok="$(grep '^top_ok=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)"
          service_ok="$(grep '^service_ok=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)"
          section_ok="$(grep '^section_ok=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)"
          vars_ok="$(grep '^vars_ok=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)"
          if [ "$top_ok" != "true" ] || [ "$service_ok" != "true" ] || [ "$section_ok" != "true" ] || [ "$vars_ok" != "true" ]; then
            echo "Staged patch did not exactly match the DataForSEO-only safety guard"
            rm -f /tmp/staged.json /tmp/staged.err
            exit 0
          fi

          cat > /tmp/commit.graphql <<'GRAPHQL'
          mutation EnvironmentPatchCommitStaged(
            $environmentId: String!, $commitMessage: String, $skipDeploys: Boolean
          ) {
            environmentPatchCommitStaged(
              environmentId: $environmentId,
              commitMessage: $commitMessage,
              skipDeploys: $skipDeploys
            )
          }
          GRAPHQL

          npx -y @railway/cli@latest api \
            --file /tmp/commit.graphql \
            --raw-var "environmentId=$RAILWAY_ENVIRONMENT_ID" \
            --raw-var "commitMessage=Activate DataForSEO credentials for disabled Link Hunter" \
            --var 'skipDeploys=true' \
            --compact > /tmp/commit.json 2>/tmp/commit.err
          if [ $? -eq 0 ]; then
            echo "committed=true" >> "$GITHUB_OUTPUT"
            echo "Exact DataForSEO staged patch committed without deployment"
          else
            echo "Railway CLI could not commit staged changes (response suppressed)"
          fi
          rm -f /tmp/staged.json /tmp/staged.err /tmp/commit.json /tmp/commit.err
          exit 0

      - name: Deploy current main with committed variables
        id: deploy
        if: steps.apply.outputs.committed == 'true'
        continue-on-error: true
        run: >-
          npx -y @railway/cli@latest up
          --project $PROJECT_ID
          --environment production
          --service youtube-domain-crawler
          --ci

      - name: Verify sanitized production readiness
        id: verify
        shell: bash
        run: |
          set +e
          ready=false
          if [ "${{ steps.apply.outputs.already_ready }}" = "true" ]; then
            ready=true
          elif [ "${{ steps.apply.outputs.committed }}" = "true" ] && [ "${{ steps.deploy.outcome }}" = "success" ]; then
            for attempt in $(seq 1 30); do
              body="$(curl -fsS https://youtube-domain-crawler-production.up.railway.app/health || true)"
              BODY="$body" python -c 'import json,os; p=json.loads(os.environ["BODY"]); assert p.get("database")=="ok"; assert p.get("link_hunter_enabled") is False; assert p.get("dataforseo_configured") is True' 2>/dev/null
              if [ $? -eq 0 ]; then ready=true; break; fi
              sleep 10
            done
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish guarded activation statuses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish() {
            value="$1"; context="$2"
            if [ "$value" = "true" ]; then state=success; else state=error; fi
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "{\"state\":\"$state\",\"context\":\"$context\"}"
          }
          publish "${{ steps.apply.outputs.top_ok }}" "stage/top-only-services"
          publish "${{ steps.apply.outputs.service_ok }}" "stage/target-service"
          publish "${{ steps.apply.outputs.section_ok }}" "stage/only-variables"
          publish "${{ steps.apply.outputs.vars_ok }}" "stage/exact-dataforseo-pair"
          if [ "${{ steps.apply.outputs.already_ready }}" = "true" ]; then deploy_ok=true
          elif [ "${{ steps.apply.outputs.committed }}" = "true" ] && [ "${{ steps.deploy.outcome }}" = "success" ]; then deploy_ok=true
          else deploy_ok=false; fi
          publish "$deploy_ok" "link-hunter/config-deploy"
          publish "${{ steps.verify.outputs.ready }}" "link-hunter/dataforseo-activation"
