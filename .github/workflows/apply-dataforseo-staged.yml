name: Apply DataForSEO Staged Variables

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-dataforseo-staged.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: railway-production-config
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_ENVIRONMENT_ID: 9f670e7a-1b3d-4ccc-b450-092a70403ee9
      RAILWAY_SERVICE_ID: 8aa9b741-7a20-4aef-8baf-c25ac82f6fce
      PROJECT_ID: 31fbe878-aa83-4b74-9820-e9f0d13b984c
    steps:
      - uses: actions/checkout@v4

      - name: Guard and commit exact staged variable patch
        id: apply
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json
          import os
          import urllib.request

          endpoint = "https://backboard.railway.com/graphql/v2"
          health_url = "https://youtube-domain-crawler-production.up.railway.app/health"
          token = os.environ.get("RAILWAY_TOKEN", "")
          environment_id = os.environ["RAILWAY_ENVIRONMENT_ID"]
          service_id = os.environ["RAILWAY_SERVICE_ID"]
          expected = {"DATAFORSEO_LOGIN", "DATAFORSEO_PASSWORD"}
          out_path = os.environ["GITHUB_OUTPUT"]

          def output(key, value):
              safe = str(value).replace("\n", " ")[:500]
              with open(out_path, "a", encoding="utf-8") as stream:
                  stream.write(f"{key}={safe}\n")

          def graphql(query, variables):
              request = urllib.request.Request(
                  endpoint,
                  data=json.dumps({"query": query, "variables": variables}).encode(),
                  headers={
                      "Project-Access-Token": token,
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              if payload.get("errors"):
                  raise RuntimeError("Railway GraphQL request failed")
              return payload["data"]

          output("committed", "false")
          output("already_ready", "false")
          output("guard", "error")
          output("diagnostic", "not_checked")

          try:
              # Idempotency: if a prior run already activated the credentials,
              # do not require or mutate any staged patch.
              with urllib.request.urlopen(health_url, timeout=15) as response:
                  health = json.load(response)
              if health.get("database") == "ok" and health.get("dataforseo_configured") is True:
                  output("already_ready", "true")
                  output("guard", "success")
                  output("diagnostic", "credentials_already_active")
                  raise SystemExit(0)

              if not token:
                  raise RuntimeError("project token missing")

              query = """
              query EnvironmentStagedChanges($environmentId: String!) {
                environmentStagedChanges(environmentId: $environmentId) { id status patch }
              }
              """
              data = graphql(query, {"environmentId": environment_id})
              staged = data.get("environmentStagedChanges") or {}
              patch = staged.get("patch") or {}

              nonempty_top = {
                  key for key, value in patch.items()
                  if value not in (None, {}, [], "")
              }
              services = patch.get("services") or {}
              service_ids = set(services)
              service_patch = services.get(service_id) or {}
              nonempty_service = {
                  key for key, value in service_patch.items()
                  if value not in (None, {}, [], "")
              }
              variables = service_patch.get("variables") or {}
              variable_names = set(variables)

              # Only names/shape are emitted; variable values are never printed.
              diagnostic = (
                  "top=" + ",".join(sorted(nonempty_top))
                  + ";services=" + str(len(service_ids))
                  + ";sections=" + ",".join(sorted(nonempty_service))
                  + ";vars=" + ",".join(sorted(variable_names))
              )
              output("diagnostic", diagnostic)

              exact = (
                  nonempty_top == {"services"}
                  and service_ids == {service_id}
                  and nonempty_service == {"variables"}
                  and variable_names == expected
              )
              if not exact:
                  raise RuntimeError("staged patch does not exactly match expected DataForSEO variables")

              mutation = """
              mutation EnvironmentPatchCommitStaged(
                $environmentId: String!, $commitMessage: String, $skipDeploys: Boolean
              ) {
                environmentPatchCommitStaged(
                  environmentId: $environmentId,
                  commitMessage: $commitMessage,
                  skipDeploys: $skipDeploys
                )
              }
              """
              graphql(
                  mutation,
                  {
                      "environmentId": environment_id,
                      "commitMessage": "Activate DataForSEO credentials for disabled Link Hunter",
                      "skipDeploys": True,
                  },
              )
              output("committed", "true")
              output("guard", "success")
          except SystemExit:
              pass
          except Exception as exc:
              output("diagnostic", f"guard_refused:{type(exc).__name__}")
          PY
          exit 0

      - name: Deploy current main with committed variables
        id: deploy
        if: steps.apply.outputs.committed == 'true'
        continue-on-error: true
        run: >-
          npx -y @railway/cli@latest up
          --project $PROJECT_ID
          --environment production
          --service youtube-domain-crawler
          --ci

      - name: Verify sanitized production readiness
        id: verify
        shell: bash
        run: |
          set +e
          ready=false
          if [ "${{ steps.apply.outputs.already_ready }}" = "true" ]; then
            ready=true
          elif [ "${{ steps.apply.outputs.committed }}" = "true" ] && [ "${{ steps.deploy.outcome }}" = "success" ]; then
            for attempt in $(seq 1 30); do
              body="$(curl -fsS https://youtube-domain-crawler-production.up.railway.app/health || true)"
              BODY="$body" python -c 'import json,os; p=json.loads(os.environ["BODY"]); assert p.get("database")=="ok"; assert p.get("link_hunter_enabled") is False; assert p.get("dataforseo_configured") is True' 2>/dev/null
              if [ $? -eq 0 ]; then
                ready=true
                break
              fi
              sleep 10
            done
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish guarded activation diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD: ${{ steps.apply.outputs.guard }}
          DIAGNOSTIC: ${{ steps.apply.outputs.diagnostic }}
          COMMITTED: ${{ steps.apply.outputs.committed }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          READY: ${{ steps.verify.outputs.ready }}
        run: |
          publish() {
            state="$1"; context="$2"; description="$3"
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "{\"state\":\"$state\",\"context\":\"$context\",\"description\":\"$description\"}"
          }

          publish "$GUARD" "link-hunter/staged-guard" "${DIAGNOSTIC:0:140}"
          if [ "$COMMITTED" = "true" ]; then
            if [ "$DEPLOY_OUTCOME" = "success" ]; then deploy_state=success; else deploy_state=error; fi
          elif [ "${{ steps.apply.outputs.already_ready }}" = "true" ]; then
            deploy_state=success
          else
            deploy_state=error
          fi
          publish "$deploy_state" "link-hunter/config-deploy" "Guarded variable commit and production deploy stage"
          if [ "$READY" = "true" ]; then ready_state=success; else ready_state=error; fi
          publish "$ready_state" "link-hunter/dataforseo-activation" "DataForSEO configured while Link Hunter remains disabled"
