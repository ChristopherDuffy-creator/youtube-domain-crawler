name: Pilot Apply DNS

# One-shot DNS setup for the three purchased pilot domains.
on:
  push:
    branches:
      - pilot/three-site-validation
    paths:
      - .github/workflows/pilot-apply-dns.yml

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Dry-run then safely apply only Railway routing and verification DNS
        shell: bash
        run: |
          set +e
          npx -y @railway/cli@latest run \
            --project 31fbe878-aa83-4b74-9820-e9f0d13b984c \
            --environment production \
            --service youtube-domain-crawler \
            --no-local \
            python -m scripts.porkbun_apply_pilot_dns
          code=$?
          echo "PILOT_DNS_EXIT=$code"
          if [ "$code" -ne 0 ]; then
            echo "::warning::Pilot DNS was not fully applied; review the machine-readable result above."
          fi
          exit 0
