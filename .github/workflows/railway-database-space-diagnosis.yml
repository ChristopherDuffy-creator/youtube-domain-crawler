name: Railway Database Space Diagnosis

# Read-only incident diagnostic. It never changes Railway variables, source
# data, or the production service.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/railway-database-space-diagnosis.yml

permissions:
  contents: read

concurrency:
  group: railway-database-space-diagnosis
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Install PostgreSQL client library
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4'

      - name: Report aggregate table and index footprint only
        run: >-
          npx -y @railway/cli@latest run
          --project 31fbe878-aa83-4b74-9820-e9f0d13b984c
          --environment production
          --service youtube-domain-crawler
          python -c "import os, psycopg; connection=psycopg.connect(os.environ['DATABASE_URL']); cursor=connection.cursor(); cursor.execute('SET TRANSACTION READ ONLY'); cursor.execute(\"SELECT relname, n_live_tup, pg_total_relation_size(relid) FROM pg_stat_user_tables ORDER BY pg_total_relation_size(relid) DESC LIMIT 20\"); print('table,estimated_rows,total_bytes'); [print(f'{name},{rows},{size}') for name, rows, size in cursor.fetchall()]; cursor.execute(\"SELECT pg_database_size(current_database())\"); print('database_bytes=' + str(cursor.fetchone()[0])); connection.close()"
