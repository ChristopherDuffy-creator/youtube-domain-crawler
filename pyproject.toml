[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008"]
"tests/test_link_hunter_integration.py" = ["I001"]
"tests/test_link_hunter_scaffold.py" = ["I001"]
